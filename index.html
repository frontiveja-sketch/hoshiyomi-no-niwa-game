<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>星詠みの庭｜六十日の星花編</title>
  <style>
    :root{
      --night:#11132b;--night2:#242245;--paper:#fffaf2;--ink:#292139;
      --plum:#4c365f;--rose:#ae5573;--blush:#f4bdcb;--gold:#c9a768;
      --muted:#897785;--good:#5f8c80;--bad:#a75668
    }
    *{box-sizing:border-box}html,body{min-width:320px;min-height:100%;margin:0}
    body{color:var(--ink);font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;
      background:radial-gradient(circle at 80% 18%,rgba(190,158,224,.3),transparent 26rem),
      radial-gradient(circle at 12% 80%,rgba(245,172,192,.16),transparent 30rem),
      linear-gradient(135deg,var(--night),var(--night2) 54%,#17152d)}
    button{font:inherit}.shell{position:relative;min-height:100svh;overflow:hidden}
    .stars{position:fixed;inset:0;pointer-events:none;opacity:.38;background-image:
      radial-gradient(circle,#fff 0 1px,transparent 1.6px),
      radial-gradient(circle,#d9c4ff 0 1px,transparent 1.7px);
      background-position:12px 18px,42px 51px;background-size:87px 87px,131px 131px}
    header{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;
      min-height:82px;padding:14px clamp(18px,3vw,52px);border-bottom:1px solid rgba(255,255,255,.13);color:white}
    .brand{display:flex;align-items:center;gap:13px}.mark{display:grid;width:40px;aspect-ratio:1;place-items:center;
      border:1px solid rgba(236,214,158,.7);border-radius:50%;color:#ead49c}
    .micro{margin:0;color:var(--gold);font:700 .62rem Arial,sans-serif;letter-spacing:.21em}
    h1{margin:2px 0 0;font-size:clamp(1.16rem,2vw,1.65rem);font-weight:500;letter-spacing:.12em}
    .head-actions{display:flex;align-items:center;gap:10px}.head-actions button{padding:8px 14px;border:1px solid rgba(255,255,255,.28);
      border-radius:99px;color:white;background:rgba(255,255,255,.08);cursor:pointer}
    .day-chip{padding:8px 14px;border:1px solid rgba(232,207,151,.4);color:#f1ddb0;font:700 .7rem Arial,sans-serif;letter-spacing:.12em}
    .game{position:relative;z-index:2;display:grid;grid-template-columns:minmax(360px,.76fr) minmax(440px,1.24fr);
      width:min(1500px,calc(100% - 32px));min-height:calc(100svh - 82px);margin:auto;border-inline:1px solid rgba(255,255,255,.1)}
    .portrait-side{position:relative;min-height:760px;overflow:hidden;background:
      radial-gradient(circle at 50% 24%,rgba(223,198,247,.24),transparent 28%),
      linear-gradient(to top,rgba(10,10,28,.94),transparent 50%)}
    .portrait-side:after{content:"";position:absolute;z-index:3;inset:auto 0 0;height:30%;background:linear-gradient(to top,#12122d,transparent);pointer-events:none}
    .arch{position:absolute;inset:6% 8% 8%;border:1px solid rgba(226,200,144,.24);border-radius:48% 48% 0 0}
    .arch:before,.arch:after{content:"";position:absolute;inset:14px;border:1px solid rgba(255,255,255,.07);border-radius:inherit}
    .portrait-window{position:absolute;z-index:2;right:auto;bottom:0;left:50%;
      width:auto;height:min(calc(100% - 14px),820px);max-width:55%;aspect-ratio:1/2;
      transform:translateX(-50%);overflow:hidden}

    .portrait.reaction.r0{background-position:0% center}.portrait.reaction.r1{background-position:33.333% center}
    .portrait.reaction.r2{background-position:66.666% center}.portrait.reaction.r3{background-position:100% center}
    .portrait-name{position:absolute;z-index:5;right:auto;bottom:68px;left:50%;
      width:min(calc(100% - 40px),360px);padding:16px 18px;transform:translateX(-50%);
      border:1px solid rgba(255,255,255,.2);color:white;background:rgba(18,17,43,.67);backdrop-filter:blur(10px)}
    .portrait-name strong{display:block;font-size:1.1rem;font-weight:500;letter-spacing:.13em}
    .portrait-name span{display:block;margin-top:4px;color:#d8cbe0;font:700 .61rem Arial,sans-serif;letter-spacing:.18em}
    .faces{position:absolute;z-index:5;right:auto;bottom:30px;left:50%;display:flex;
      justify-content:flex-end;width:min(calc(100% - 40px),360px);gap:7px;transform:translateX(-50%)}.faces i{width:8px;height:8px;
      border:1px solid rgba(255,255,255,.5);border-radius:50%;transition:.35s}.faces i.on{border-color:var(--blush);background:var(--blush);box-shadow:0 0 12px var(--blush)}
    .spark{position:absolute;z-index:4;inset:12% 10% 28%;pointer-events:none}.spark span{position:absolute;color:#ffe6a9;opacity:0}
    .spark.go span{animation:spark .9s ease-out}.spark span:nth-child(1){top:8%;left:12%}.spark span:nth-child(2){top:22%;right:8%;animation-delay:.1s}
    .spark span:nth-child(3){top:48%;left:7%;animation-delay:.18s}.spark span:nth-child(4){top:10%;right:26%;animation-delay:.25s}
    .control{position:relative;z-index:4;padding:clamp(24px,3.5vw,50px);background:linear-gradient(145deg,rgba(255,250,242,.985),rgba(246,237,237,.97));
      box-shadow:-30px 0 70px rgba(6,7,24,.25)}
    .control:before{content:"";position:absolute;inset:0 auto 0 0;width:8px;opacity:.45;background:repeating-linear-gradient(90deg,var(--gold) 0 1px,transparent 1px 4px)}
    .topline{display:flex;align-items:center;gap:12px;color:#7c7080;font-size:.7rem;letter-spacing:.11em}.topline i{width:36px;height:1px;background:var(--gold)}
    .title-row{display:flex;align-items:end;justify-content:space-between;gap:18px;margin:24px 0 20px}
    h2{margin:4px 0 0;color:#2b233c;font-size:clamp(1.75rem,3.3vw,3.1rem);font-weight:500;letter-spacing:.06em}
    .turn{min-width:145px;text-align:right}.turn strong{display:block;color:var(--rose);font:400 2rem Georgia,serif}.turn span{color:var(--muted);font-size:.7rem}
    .stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:17px}
    .stat{padding:10px;border:1px solid rgba(77,54,95,.14);background:rgba(255,255,255,.65)}
    .stat label{display:flex;justify-content:space-between;color:#756473;font-size:.67rem}.stat b{color:var(--plum);font-family:Georgia,serif;font-weight:400}
    .bar{height:4px;margin-top:7px;overflow:hidden;border-radius:99px;background:#e5dce1}.bar i{display:block;height:100%;background:linear-gradient(90deg,#c98ca1,#9d4967);transition:width .45s}
    .stat.energy .bar i{background:linear-gradient(90deg,#8bb1a7,#527d74)}
    .inventory{display:flex;align-items:center;gap:7px;min-height:31px;margin-bottom:16px;color:#766875;font-size:.68rem}
    .inventory>span:first-child{margin-right:3px;color:#9a8053;letter-spacing:.08em}.item{padding:4px 8px;border:1px solid rgba(199,166,104,.35);background:#fffdf8}
    .item.empty{color:#aaa;border-style:dashed;background:transparent}
    .dialogue{position:relative;min-height:104px;padding:27px 24px 18px;border-block:1px solid rgba(199,166,104,.58);
      background:linear-gradient(90deg,rgba(255,255,255,.78),transparent);animation:reveal .38s ease}
    .nameplate{position:absolute;top:-11px;left:17px;padding:3px 18px;color:white;background:var(--plum);font-size:.74rem;letter-spacing:.12em}
    .dialogue p{margin:0;color:#3d3448;font-size:clamp(.86rem,1.25vw,1rem);line-height:1.9}
    .hint{display:flex;align-items:center;gap:8px;margin:13px 0;padding:8px 11px;border-left:2px solid var(--gold);color:#776776;background:rgba(255,255,255,.43);font-size:.68rem;line-height:1.6}
    .actions-title{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px}.actions-title p{margin:0;color:#8d7780;font:700 .62rem Arial,sans-serif;letter-spacing:.18em}
    .actions-title span{color:#8f808c;font-size:.65rem}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
    .campaign{display:grid;grid-template-columns:1fr auto;gap:9px 15px;align-items:end;margin:0 0 15px;padding:11px 13px;
      border:1px solid rgba(77,56,95,.13);background:rgba(255,255,255,.5)}
    .campaign strong{color:var(--plum);font-size:.78rem;font-weight:500}.campaign span{color:#8f7f8c;font:700 .58rem Arial,sans-serif;letter-spacing:.13em}
    .campaign-track{grid-column:1/-1;height:4px;overflow:hidden;border-radius:99px;background:#e5dce1}
    .campaign-track i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--gold),var(--rose));transition:width .45s}
    .action{position:relative;min-height:65px;padding:10px 12px 10px 47px;border:1px solid rgba(77,56,95,.2);text-align:left;color:#40344e;background:rgba(255,255,255,.74);cursor:pointer;transition:.17s}
    .action:hover:not(:disabled),.action:focus-visible:not(:disabled){border-color:var(--rose);background:white;transform:translateY(-2px);box-shadow:0 8px 22px rgba(77,56,95,.1);outline:none}
    .action:disabled{opacity:.43;cursor:not-allowed}.action .icon{position:absolute;left:12px;top:13px;display:grid;width:25px;aspect-ratio:1;place-items:center;border:1px solid rgba(199,166,104,.5);border-radius:50%;color:#a47b44}
    .action strong{display:block;font-size:.81rem;font-weight:500}.action small{display:block;margin-top:4px;color:#8e7f89;font-family:Arial,sans-serif;font-size:.59rem;line-height:1.35}
    .journal{margin-top:13px;padding-top:10px;border-top:1px solid rgba(77,56,95,.12)}
    .journal summary{color:#7c6c78;font-size:.68rem;cursor:pointer}.journal ol{max-height:92px;margin:8px 0 0;padding-left:21px;overflow:auto;color:#8b7b86;font-size:.66rem;line-height:1.65}
    .modal{position:fixed;z-index:50;inset:0;display:grid;place-items:center;padding:18px;background:rgba(9,9,25,.78);backdrop-filter:blur(8px)}
    .modal[hidden]{display:none}.event{width:min(620px,100%);padding:clamp(24px,4vw,42px);border:1px solid rgba(233,207,150,.55);
      color:var(--ink);background:linear-gradient(145deg,#fffaf2,#f1e5e8);box-shadow:0 30px 100px rgba(0,0,0,.4);animation:reveal .42s ease}
    .event .micro{color:#9e7945}.event h3{margin:8px 0 13px;color:var(--plum);font-size:clamp(1.35rem,4vw,2rem);font-weight:500}
    .event>p{color:#675b68;font-size:.84rem;line-height:1.9}.event-choices{display:grid;gap:8px;margin-top:19px}
    .event-choice{padding:13px 15px;border:1px solid rgba(77,56,95,.2);text-align:left;color:#40344e;background:rgba(255,255,255,.72);cursor:pointer}
    .event-choice:hover:not(:disabled){border-color:var(--rose);background:white}.event-choice:disabled{opacity:.4}
    .event-choice strong{display:block;font-size:.82rem;font-weight:500}.event-choice span{display:block;margin-top:3px;color:#8e7d89;font-size:.65rem}
    .save-grid{display:grid;gap:9px;margin-top:18px}.save-slot{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;
      padding:12px 13px;border:1px solid rgba(77,56,95,.2);background:rgba(255,255,255,.7)}
    .save-slot strong{font-size:.78rem;font-weight:500}.save-slot small{grid-column:1;color:#8d7c88;font-size:.63rem;line-height:1.5}
    .save-actions{grid-row:1/3;grid-column:2;display:flex;gap:6px}.save-actions button{padding:7px 10px;border:1px solid rgba(77,56,95,.2);
      color:var(--plum);background:white;cursor:pointer}.save-actions button:disabled{opacity:.35;cursor:not-allowed}
    .save-note{margin:12px 0 0!important;padding:9px 11px;border-left:2px solid var(--gold);background:rgba(255,255,255,.45);font-size:.68rem!important}
    .toast{position:fixed;z-index:80;right:18px;bottom:18px;max-width:min(360px,calc(100% - 36px));padding:11px 15px;
      border:1px solid rgba(233,207,150,.48);color:white;background:rgba(18,17,43,.94);box-shadow:0 15px 45px rgba(0,0,0,.3);
      opacity:0;transform:translateY(8px);pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:none}
    .ending{text-align:center}.ending .rank{display:grid;width:70px;aspect-ratio:1;margin:0 auto 15px;place-items:center;border:1px solid var(--gold);border-radius:50%;color:var(--rose);font:400 2rem Georgia,serif}
    .ending h3{font-size:clamp(1.7rem,5vw,2.6rem)}.ending button{margin-top:20px;padding:11px 24px;border:0;border-radius:99px;color:white;background:var(--rose);cursor:pointer}
    .requirements{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:18px}.req{padding:8px;border:1px solid rgba(77,56,95,.15);font-size:.65rem}.req.ok{color:var(--good);border-color:rgba(95,140,128,.4)}.req.no{color:var(--bad)}
    @keyframes reveal{from{opacity:0;transform:translateY(8px)}}@keyframes spark{0%{opacity:0;transform:scale(.5)}38%{opacity:1}100%{opacity:0;transform:scale(1.8) rotate(45deg) translateY(-18px)}}
    @media(max-width:980px){.game{grid-template-columns:1fr;width:100%;border:0}.portrait-side{min-height:clamp(520px,72svh,740px)}.portrait-window{height:min(calc(100% - 14px),700px);max-width:54%}.control{padding:30px clamp(20px,6vw,50px) 45px}.stats{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:580px){header{min-height:72px}.micro.head{display:none}.day-chip{display:none}.head-actions button{font-size:.7rem}.portrait-side{min-height:clamp(460px,68svh,620px)}.portrait-window{height:min(calc(100% - 10px),590px);max-width:68%}.title-row{align-items:start}.turn{min-width:90px}.turn strong{font-size:1.55rem}.stats{grid-template-columns:repeat(2,1fr)}.actions{grid-template-columns:1fr}.requirements{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
<main class="shell">
  <div class="stars" aria-hidden="true"></div>
  <header>
    <div class="brand"><span class="mark">✦</span><div><p class="micro head">OFFLINE STRATEGY ROMANCE</p><h1>星詠みの庭</h1></div></div>
    <div class="head-actions"><span class="day-chip" id="dayChip">DAY 1 / MORNING</span><button type="button" id="saveButton">セーブ</button><button type="button" id="reset">最初から</button></div>
  </header>
  <section class="game">
    <aside class="portrait-side">
      <div class="arch"></div>
      <div class="portrait-window"><div class="portrait" id="portrait" role="img" aria-label="レンの立ち絵"></div></div>
      <div class="spark" id="spark" aria-hidden="true"><span>✦</span><span>✧</span><span>✦</span><span>✧</span></div>
      <div class="portrait-name"><strong>レン・アステル</strong><span>CELESTIAL BOTANIST</span></div>
      <div class="faces" id="faces"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </aside>
    <section class="control">
      <div class="topline"><span>六十日の星花編</span><i></i><span>王立天象院・星花温室</span></div>
      <div class="title-row">
        <div><p class="micro">A SIX-CHAPTER LONG ROMANCE</p><h2 id="phaseTitle">第1日・朝</h2></div>
        <div class="turn"><strong id="turnsLeft">180</strong><span>残り行動</span></div>
      </div>
      <div class="campaign"><strong id="chapterTitle">第一章　星灯花の契約</strong><span id="chapterMeta">全60日・想定5〜6時間</span><div class="campaign-track"><i id="campaignBar"></i></div></div>
      <div class="stats">
        <div class="stat"><label>好感度 <b id="affVal">10</b></label><div class="bar"><i id="affBar"></i></div></div>
        <div class="stat"><label>信頼 <b id="trustVal">8</b></label><div class="bar"><i id="trustBar"></i></div></div>
        <div class="stat"><label>星花知識 <b id="loreVal">0</b></label><div class="bar"><i id="loreBar"></i></div></div>
        <div class="stat"><label>決意 <b id="willVal">3</b></label><div class="bar"><i id="willBar"></i></div></div>
        <div class="stat"><label>王都評価 <b id="renownVal">0</b></label><div class="bar"><i id="renownBar"></i></div></div>
        <div class="stat energy"><label>体力 <b id="energyVal">9</b></label><div class="bar"><i id="energyBar"></i></div></div>
      </div>
      <div class="inventory" id="inventory"><span>大切なもの</span></div>
      <div class="dialogue" id="dialogue"><span class="nameplate" id="speaker">レン</span><p id="line"></p></div>
      <div class="hint"><span>✦</span><span id="hint">高い好感度だけでは真実の恋には届かない。信頼と研究、そして自分の決意も育てよう。</span></div>
      <div class="actions-title"><p>SELECT AN ACTION</p><span id="phaseLabel">朝の行動を選んでください</span></div>
      <div class="actions" id="actions"></div>
      <details class="journal"><summary>これまでの記録</summary><ol id="log"></ol></details>
    </section>
  </section>
</main>
<div class="modal" id="modal" hidden><div class="event" id="event"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const clamp=n=>Math.max(0,Math.min(100,n));
const initial=()=>({day:1,phase:0,aff:10,trust:8,lore:0,will:3,energy:9,items:[],flags:[],used:[],log:[],ended:false});
let s=initial();
const $=id=>document.getElementById(id);
const statusLine=()=>{const warmth=s.aff*.55+s.trust*.3+s.will*.15;return warmth>=70?["3","恋心を隠せない、とびきりの笑顔"]:warmth>=46?["2","会える時間を、楽しみにしている"]:warmth>=25?["1","あなたにだけ、微笑みを見せはじめた"]:["0","まだ少し、距離を測っているみたい"]};
const actions=[
  {id:"green",icon:"❀",name:"温室を手伝う",note:"好感度・知識／体力−2",cost:2,run(){gain({aff:5,lore:3,trust:1,energy:-2});if(s.lore>=18&&!has("月白花の種"))addItem("月白花の種");say("君は花の声を聞くのが上手だね。……僕よりも、少しだけ。");record("温室で星花の世話をした。");}},
  {id:"archive",icon:"⌕",name:"書庫で研究する",note:"知識を大きく上昇／体力−2",cost:2,run(){gain({lore:7,trust:2,energy:-2});if(s.lore>=28&&!has("星砂の栞"))addItem("星砂の栞");say("その頁に気づくとは思わなかった。君になら、研究を任せられそうだ。");record("古い星花の記録を読み解いた。");}},
  {id:"errand",icon:"♧",name:"王都の依頼を手伝う",note:"信頼・決意／体力−3",cost:3,run(){gain({trust:6,will:4,aff:1,energy:-3});say("君となら、面倒な仕事も悪くない。頼りにしているよ。");record("レンと協力して王都の依頼を終えた。");}},
  {id:"tea",icon:"♨",name:"二人でお茶を飲む",note:"信頼18以上・各日1回",cost:2,unlock:()=>s.trust>=18&&!s.used.includes("tea"),run(){gain({aff:6,trust:4,lore:1,energy:-2});say("こうして君と話す時間が、最近はいちばん落ち着くんだ。");s.used.push("tea");record("温室の奥で二人きりのお茶を楽しんだ。");}},
  {id:"walk",icon:"☾",name:"星見の散歩に誘う",note:"4日目・好感度25以上・夜限定",cost:3,unlock:()=>s.day>=4&&s.phase===1&&s.aff>=25&&!s.used.includes("walk"),run(){gain({aff:7,will:5,trust:2,energy:-3});say("君の隣で見る星は、なぜかいつもより近いね。");s.used.push("walk");record("レンと星空の下を歩いた。");}},
  {id:"rest",icon:"✦",name:"自室で休む",note:"体力＋6・関係値は変化なし",cost:0,run(){gain({energy:6});say("無理はしないで。君が倒れたら……僕が困る。");record("次の行動に備えて体を休めた。");}}
];
const events={
  "2-0":{tag:"SPECIAL EVENT 01",title:"芽吹かない星灯花",text:"レンが十年育てても芽吹かなかった種を見せてくれた。扱い方ひとつで、彼との距離も研究も変わりそうだ。",choices:[
    ["まず土と星位を調べる","知識を活かす","+知識10・信頼3",()=>gain({lore:10,trust:3})],
    ["レンの考えを最後まで聞く","彼を信じる","+信頼9・好感度4",()=>gain({trust:9,aff:4})],
    ["直感を信じ、光にかざす","決意を示す","+決意9・好感度3／知識が高いと種を獲得",()=>{gain({will:9,aff:3});if(s.lore>=15)addItem("月白花の種")}] ]},
  "4-1":{tag:"SPECIAL EVENT 02",title:"硝子温室の嵐",text:"突然の星嵐で温室の天窓が割れた。花、研究記録、そしてレン——すべてを守る時間はない。",choices:[
    ["レンと背中を預け合い、天窓を塞ぐ","体力3以上で選択可","+信頼12・決意6／体力−3",()=>{gain({trust:12,will:6,energy:-3});flag("嵐を共に越えた")} ,()=>s.energy>=3],
    ["危険を承知でレンのもとへ走る","気持ちを優先","+好感度11・信頼4／体力−2",()=>{gain({aff:11,trust:4,energy:-2});flag("嵐を共に越えた")}],
    ["失われかけた研究記録を救う","未来を優先","+知識13・信頼5",()=>gain({lore:13,trust:5})] ]},
  "6-0":{tag:"SPECIAL EVENT 03",title:"流星祭への招待",text:"レンは招待状を手に、珍しく言葉を探している。好感度か信頼が足りていれば、彼の本心を引き出せそうだ。",choices:[
    ["「あなたと一緒に行きたい」","好感度30または信頼28で選択可","+好感度9・決意8／約束成立",()=>{gain({aff:9,will:8});flag("流星祭の約束")} ,()=>s.aff>=30||s.trust>=28],
    ["仕事の相談を口実に同行する","慎重な距離感","+信頼7・好感度4",()=>gain({trust:7,aff:4})],
    ["祭より研究を完成させたい","研究優先","+知識10・決意4",()=>gain({lore:10,will:4})] ]},
  "8-1":{tag:"SPECIAL EVENT 04",title:"封じられた研究ノート",text:"書庫の奥で、レンが隠していた失敗の記録を見つけた。開くか、待つか。あなたの積み重ねが選択肢を変える。",choices:[
    ["星砂の栞で暗号を解き、彼に返す","栞＋知識45以上で選択可","+知識8・信頼13／秘密を共有",()=>{gain({lore:8,trust:13});flag("秘密を共有した")} ,()=>has("星砂の栞")&&s.lore>=45],
    ["本人が話すまで待つ","彼の境界を尊重","+信頼10・好感度4／秘密を共有",()=>{gain({trust:10,aff:4});flag("秘密を共有した")}],
    ["問い詰めて真実を聞く","答えを急ぐ","+知識6・決意4／信頼−5",()=>gain({lore:6,will:4,trust:-5})] ]},
  "10-0":{tag:"FINAL EVENT",title:"祭りの朝、最後の贈り物",text:"今夜、十年に一度の流星が降る。レンへ渡すものが、二人の結末をそっと後押しする。",choices:[
    ["育てた月白花の種を贈る","種を持っていると選択可","+好感度11・信頼5",()=>gain({aff:11,trust:5}),()=>has("月白花の種")],
    ["研究を完成させた星図を贈る","知識55以上で選択可","+信頼9・知識6",()=>gain({trust:9,lore:6}),()=>s.lore>=55],
    ["何も飾らず、想いを告げる","決意30以上で選択可","+決意10・好感度8",()=>gain({will:10,aff:8}),()=>s.will>=30],
    ["今までの感謝だけを伝える","条件なし","+好感度4・信頼4",()=>gain({aff:4,trust:4})] ]}
};
function has(x){return s.items.includes(x)}function flag(x){if(!s.flags.includes(x))s.flags.push(x)}
function addItem(x){if(!has(x)){s.items.push(x);record("大切なもの「"+x+"」を手に入れた。")}}
function gain(o){for(const[k,v]of Object.entries(o)){s[k]=k==="energy"?Math.max(0,Math.min(10,s[k]+v)):clamp(s[k]+v)}}
function record(text){s.log.unshift("第"+s.day+"日"+(s.phase?"・夜":"・朝")+"： "+text);s.log=s.log.slice(0,12)}
function say(text,speaker="レン"){$("speaker").textContent=speaker;$("line").textContent="「"+text+"」";$("dialogue").style.animation="none";void $("dialogue").offsetWidth;$("dialogue").style.animation=""}
function sparkle(){$("spark").classList.remove("go");void $("spark").offsetWidth;$("spark").classList.add("go")}
function doAction(a){if(s.ended||s.energy<a.cost||(a.unlock&&!a.unlock()))return;a.run();sparkle();advance()}
function advance(){if(s.phase===0){s.phase=1}else{s.phase=0;s.day++;s.energy=Math.min(10,s.energy+2);s.used=[]}render();if(s.day>10){finish();return}const key=s.day+"-"+s.phase;if(events[key])window.setTimeout(()=>showEvent(events[key]),280)}
function showEvent(e){const box=$("event");box.className="event";box.innerHTML='<p class="micro">'+e.tag+'</p><h3>'+e.title+'</h3><p>'+e.text+'</p><div class="event-choices"></div>';const list=box.querySelector(".event-choices");
  e.choices.forEach(c=>{const b=document.createElement("button");const ok=!c[4]||c[4]();b.className="event-choice";b.disabled=!ok;b.innerHTML="<strong>"+c[0]+"</strong><span>"+c[1]+" ／ "+c[2]+"</span>";b.onclick=()=>{c[3]();record(e.title+"——"+c[0]);$("modal").hidden=true;sparkle();render()};list.appendChild(b)});$("modal").hidden=false}
function endingData(){const trueOk=s.aff>=75&&s.trust>=65&&s.lore>=50&&s.will>=30&&s.flags.includes("流星祭の約束")&&s.flags.includes("秘密を共有した");
  if(trueOk)return["S","星々の誓約","咲いた星灯花の下で、レンはあなたの手を取った。恋人として、研究の相棒として。二人は同じ未来を選び、十年後の星へ歩き始める。"];
  if(s.aff>=65&&s.trust>=50&&s.will>=22)return["A","花咲く告白","流星の夜、二人の想いはようやく言葉になった。まだ知らない秘密はある。それでも、次の季節を一緒に迎える約束をした。"];
  if(s.trust>=55&&s.lore>=65)return["B","ふたりの研究室","恋より先に結ばれたのは、揺るぎない信頼だった。共同研究者となった二人の距離は、これからゆっくり変わっていく。"];
  if(s.aff>=40)return["C","すれ違う流星","想いは確かにあった。けれど互いの未来を重ねるには、言葉と時間が少しだけ足りなかった。"];
  return["D","閉じた蕾","星灯花は眠ったまま、祭りの夜が明けた。次に出会うとき、違う選択ができるだろうか。"]}
function finish(){s.ended=true;const e=endingData();const checks=[["好感度 75",s.aff>=75],["信頼 65",s.trust>=65],["知識 50",s.lore>=50],["決意 30",s.will>=30],["流星祭の約束",s.flags.includes("流星祭の約束")],["秘密の共有",s.flags.includes("秘密を共有した")]];
  const box=$("event");box.className="event ending";box.innerHTML='<div class="rank">'+e[0]+'</div><p class="micro">ENDING</p><h3>'+e[1]+'</h3><p>'+e[2]+'</p><div class="requirements">'+checks.map(x=>'<div class="req '+(x[1]?"ok":"no")+'">'+(x[1]?"✓ ":"× ")+x[0]+"</div>").join("")+'</div><button type="button" id="retry">十日前へ戻る</button>';$("modal").hidden=false;$("retry").onclick=reset}
function render(){const phase=s.phase?"夜":"朝";$("dayChip").textContent="DAY "+Math.min(s.day,10)+" / "+(s.phase?"EVENING":"MORNING");$("phaseTitle").textContent="第"+Math.min(s.day,10)+"日・"+phase;$("phaseLabel").textContent=phase+"の行動を選んでください";$("turnsLeft").textContent=Math.max(0,(10-s.day)*2+(2-s.phase));

      ["王宮の通行証", "危機の中でも働いた功績により、封鎖区画へ入れる通行証を得た。隠された記録へ道が開く。", "王宮の通行証", 0],
      ["王家の星印", "三十五回の依頼を通じて、王家から星印を託された。王都全体の祈りを術式へ運ぶ第三の重要品だ。", "王家の星印", 0],
    ],
    tea: [
      ["砂糖を半分", "レンはあなたの好みを覚え、砂糖を入れる前に目で確認した。小さな習慣が二人の日常になっていく。", "銀葉茶の缶", 2],
      ["言えなかった初恋", "湯気の向こうで、レンは初恋について語ろうとして何度も言葉を変える。答えはほとんど告白に近かった。", "星形の角砂糖", 3],
      ["同じカップの傷", "使い続けた二つのカップに同じ細い傷が入った。レンは捨てずに金継ぎしようと提案する。", "金継ぎのカップ", 2],
      ["帰る場所の鍵", "温室の私室へ通じる鍵を渡された。研究の助手ではなく、帰る場所を分ける相手として。", "温室の合鍵", 3],
    ],
    observe: [
      ["流星の欠片", "観測台に落ちた小さな流星片が、二人の声に反応して明滅する。", "流星の欠片", 0],
      ["七分先の星時計", "観測を重ね、未来を映す七分間の規則を突き止めた。危機の回避に使えるかもしれない。", "七分星時計", 0],
      ["重なる軌道", "二つの星の軌道が六十年ぶりに重なった。レンは偶然ではなく選択だと言う。", "重星の観測紙", 2],
      ["黎明座標", "最後の観測で、犠牲を必要としない一瞬の座標を割り出した。", "黎明座標", 0],
    ],
  };

  const sideThresholds = [5, 12, 22, 35];

  const freshState = () => ({
    version: 2,
    day: 1,
    phase: 0,
    steps: 0,
    aff: 10,
    trust: 8,
    lore: 0,
    will: 3,
    renown: 0,
    energy: 10,
    items: [],
    flags: [],
    vows: [],
    used: [],
    log: [],
    seen: [],
    route: null,
    routes: { garden: 0, truth: 0, crown: 0 },
    actionCounts: { green: 0, archive: 0, city: 0, tea: 0, observe: 0, walk: 0, gift: 0, letters: 0, rest: 0 },
    reaction: null,
    ended: false,
  });

  let state = freshState();
  let eventQueue = [];
  let currentEvent = null;
  let pendingEnding = false;
  let toastTimer = null;

  const clamp = (n) => Math.max(0, Math.min(100, n));
  const chapterNumber = (day = state.day) => Math.min(6, Math.ceil(Math.min(day, MAX_DAY) / 10));
  const hasItem = (name) => state.items.includes(name);
  const addFlag = (name) => {
    if (!state.flags.includes(name)) state.flags.push(name);
  };
  const addItem = (name) => {
    if (name && !hasItem(name)) {
      state.items.push(name);
      record(`大切なもの「${name}」を手に入れた。`);
    }
  };
  const gain = (effects) => {
    Object.entries(effects).forEach(([key, value]) => {
      if (key === "energy") state.energy = Math.max(0, Math.min(10, state.energy + value));
      else if (key in state) state[key] = clamp(state[key] + value);
    });
  };
  const addRoute = (route, amount = 1) => {
    if (route && route in state.routes) state.routes[route] += amount;
  };
  const record = (text) => {
    state.log.unshift(`第${Math.min(state.day, MAX_DAY)}日・${PHASES[state.phase]}：${text}`);
    state.log = state.log.slice(0, 24);
  };
  const say = (text, speaker = "レン") => {
    el("speaker").textContent = speaker;
    el("line").textContent = `「${text}」`;
    el("dialogue").style.animation = "none";
    void el("dialogue").offsetWidth;
    el("dialogue").style.animation = "";
  };
  const sparkle = () => {
    el("spark").classList.remove("go");
    void el("spark").offsetWidth;
    el("spark").classList.add("go");
  };
  const showToast = (text) => {
    const node = el("toast");
    node.textContent = text;
    node.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => node.classList.remove("show"), 2200);
  };

  const actionLines = {
    green: [
      "君と育てた花は、僕一人の時より素直だ。少し妬けるくらいに。",
      "その手つき、もう助手とは呼べないね。僕の大切な共同研究者だ。",
      "花に触れる君を見ていると、ここが帰る場所に思える。",
    ],
    archive: [
      "君の読み方は大胆だけど、筋が通っている。次の頁も一緒に見よう。",
      "秘密を知るたび、君に隠し事をするのが難しくなる。",
      "この星図に二人の名前を書けたら……いや、続きを調べよう。",
    ],
    city: [
      "君は人の心を動かす。研究室に閉じこもっていた僕にはない力だ。",
      "王都が君を信じる理由が分かった。僕も同じだから。",
      "頼もしいよ。でも、危険な時は僕にも君を守らせて。",
    ],
    tea: [
      "今日は君の好きな茶葉にした。覚えていたことは、秘密にしない。",
      "こういう時間が研究より大切になるなんて、以前の僕なら信じなかった。",
      "カップを片づけるのが惜しい。もう少しだけ話していかない？",
    ],
    observe: [
      "同じ星を見ているはずなのに、君が隣にいると意味が変わる。",
      "七分先の未来より、今の君の表情を見ていたい。",
      "この座標を覚えておこう。迷った時、二人で帰ってこられるように。",
    ],
    walk: [
      "手をつないでもいい？　転ばないため、という理由では足りないかな。",
      "君の歩幅を覚えた。離れても、すぐ見つけられる。",
      "遠回りをしよう。今夜くらい、結末を急がなくてもいい。",
    ],
    gift: [
      "僕のために？　……困ったな。大事にしすぎて使えそうにない。",
      "受け取ったもの以上を返したい。星蝕の後にも、時間をくれる？",
      "君からもらった証を、いちばん心臓に近い場所へ置いておく。",
    ],
    letters: [
      "君の文章は温かいね。冷たい評議会の返事まで、少し人間らしくなる。",
      "二人の署名を並べた。悪くない……むしろ、嬉しい。",
      "返事が増えたのは研究の力だけじゃない。君が信頼を結んだからだ。",
    ],
    rest: [
      "休むことも研究の一部だよ。君が元気でいることが、僕には重要だから。",
      "目を閉じて。ここは僕が見ている。",
      "今日は頑張りすぎたね。明日も隣にいてほしいから、今は休もう。",
    ],
  };

  const actionsLong = [
    {
      id: "green", icon: "❀", name: "星花を育成する", cost: 2,
      note: "好感度・知識／庭ルート",
      run() { gain({ aff: 2, lore: 3, trust: 1, energy: -2 }); addRoute("garden"); },
    },
    {
      id: "archive", icon: "⌕", name: "禁書庫を調査する", cost: 2,
      note: "知識・信頼／真理ルート",
      run() { gain({ lore: 4, trust: 1, will: 1, energy: -2 }); addRoute("truth"); },
    },
    {
      id: "city", icon: "♧", name: "王都の依頼を解く", cost: 3,
      note: "王都評価・決意／王都ルート",
      run() { gain({ renown: 4, will: 2, trust: 1, energy: -3 }); addRoute("crown"); },
    },
    {
      id: "tea", icon: "♨", name: "レンとお茶を飲む", cost: 2,
      note: "信頼15以上・各日1回",
      unlock: () => state.trust >= 15 && !state.used.includes("tea"),
      lock: "信頼15以上・本日未実行",
      run() { gain({ aff: 4, trust: 3, energy: -2 }); state.used.push("tea"); addRoute("garden", 2); },
    },
    {
      id: "observe", icon: "☾", name: "天象台で観測する", cost: 2,
      note: "5日目以降・夜限定",
      unlock: () => state.day >= 5 && state.phase === 2,
      lock: "5日目以降の夜",
      run() { gain({ lore: 4, will: 3, energy: -2 }); addRoute("truth", 2); },
    },
    {
      id: "walk", icon: "♡", name: "星見の散歩へ誘う", cost: 3,
      note: "好感度25以上・夜・各日1回",
      unlock: () => state.aff >= 25 && state.phase === 2 && !state.used.includes("walk"),
      lock: "好感度25以上の夜",
      run() { gain({ aff: 5, trust: 2, will: 1, energy: -3 }); state.used.push("walk"); addRoute("garden", 2); },
    },
    {
      id: "gift", icon: "◇", name: "章の贈り物を作る", cost: 3,
      note: "知識20以上・各章1回",
      unlock: () => state.lore >= 20 && !state.flags.includes(`gift-${chapterNumber()}`),
      lock: "知識20以上・今章未実行",
      run() {
        const chapter = chapterNumber();
        gain({ aff: 5, will: 2, energy: -3 });
        addFlag(`gift-${chapter}`);
        addItem(`第${chapter}章の星花飾り`);
        addRoute("garden");
      },
    },
    {
      id: "letters", icon: "✉", name: "支援者へ手紙を書く", cost: 1,
      note: "朝限定・王都評価と信頼",
      unlock: () => state.phase === 0,
      lock: "朝限定",
      run() { gain({ renown: 3, trust: 2, energy: -1 }); addRoute("crown"); },
    },
    {
      id: "rest", icon: "✦", name: "自室で休む", cost: 0,
      note: "体力＋6・時間は進む",
      run() { gain({ energy: 6 }); },
    },
  ];

  const dominantRoute = () => Object.entries(state.routes).sort((a, b) => b[1] - a[1])[0][0];
  const statForMood = { bond: "trust", romance: "aff", research: "lore", mystery: "lore", city: "renown", crisis: "will" };
  const statLabel = { aff: "好感度", trust: "信頼", lore: "知識", will: "決意", renown: "王都評価" };

  const formatEffects = (effects) => Object.entries(effects)
    .map(([key, value]) => `${value >= 0 ? "+" : ""}${statLabel[key] || (key === "energy" ? "体力" : key)}${value}`)
    .join("・");

  const standardChoices = (event) => {
    const chapter = chapterNumber(event.day);
    const key = statForMood[event.mood];
    const required = Math.min(78, 12 + chapter * 10);
    return choiceDeck[event.mood].map((row, index) => {
      const [label, note, effects, route, reaction] = row;
      const needsCheck = index === 0 && chapter >= 2;
      return {
        label,
        note: `${note} ／ ${formatEffects(effects)}${needsCheck ? ` ／ ${statLabel[key]}${required}以上` : ""}`,
        effects,
        route,
        reaction,
        ok: () => !needsCheck || state[key] >= required,
      };
    });
  };

  const checkpointChoices = (event) => {
    const chapter = chapterNumber(event.day);
    const base = 12 + chapter * 8;
    return [
      {
        label: "二人の心と花を守る誓いを立てる",
        note: `庭の誓い ／ 好感度${base}・信頼${base}以上`,
        effects: { aff: 5, trust: 5, will: 2 }, route: "garden", reaction: 3,
        ok: () => state.aff >= base && state.trust >= base,
        vow: `第${chapter}章・庭の誓い`,
      },
      {
        label: "犠牲のない真理を必ず見つけると誓う",
        note: `真理の誓い ／ 知識${base + 4}以上`,
        effects: { lore: 7, trust: 3, will: 2 }, route: "truth", reaction: 0,
        ok: () => state.lore >= base + 4,
        vow: `第${chapter}章・真理の誓い`,
      },
      {
        label: "王都の人々まで救うと誓う",
        note: `王都の誓い ／ 王都評価${base}・決意${base - 2}以上`,
        effects: { renown: 7, will: 5, aff: 1 }, route: "crown", reaction: 0,
        ok: () => state.renown >= base && state.will >= base - 2,
        vow: `第${chapter}章・王都の誓い`,
      },
      {
        label: "今は答えを決めず、次の十日へ進む",
        note: "条件なし ／ 信頼+2・知識+2",
        effects: { trust: 2, lore: 2 }, route: dominantRoute(), reaction: 1,
        ok: () => true,
        vow: null,
      },
    ];
  };

  const eventForDay = (day) => {
    const row = storyRows[day - 1];
    const [title, text, mood, reaction] = row;
    const event = {
      day,
      tag: day % 10 === 0 ? `CHAPTER ${chapterNumber(day)} FINALE` : `DAY ${String(day).padStart(2, "0")} STORY`,
      title,
      text,
      mood,
      reaction,
      checkpoint: day % 10 === 0,
    };
    event.choices = event.checkpoint ? checkpointChoices(event) : standardChoices(event);
    return event;
  };

  const sideEventFor = (actionId) => {
    const chain = sideChains[actionId];
    if (!chain) return null;
    const count = state.actionCounts[actionId] || 0;
    const index = sideThresholds.indexOf(count);
    if (index < 0) return null;
    const [title, text, reward, reaction] = chain[index];
    const marker = `side-${actionId}-${index}`;
    if (state.seen.includes(marker)) return null;
    state.seen.push(marker);
    const event = {
      tag: `BOND EPISODE ${String(state.seen.filter((x) => x.startsWith("side-")).length).padStart(2, "0")}`,
      title,
      text,
      mood: actionId === "city" ? "city" : actionId === "archive" || actionId === "observe" ? "research" : "romance",
      reaction,
      reward,
      side: true,
    };
    event.choices = standardChoices({ ...event, day: state.day });
    return event;
  };

  const queueEvent = (event) => {
    if (event) eventQueue.push(event);
  };

  const currentExpression = () => {
    if (state.reaction !== null) {
      const labels = ["驚いて言葉を失っている", "心配と迷いが表情ににじんでいる", "目を伏せ、照れた微笑みを見せている", "頬を赤らめ、恋心を隠せない笑顔"];
      return { className: `portrait reaction r${state.reaction}`, index: 4 + state.reaction, label: labels[state.reaction] };
    }
    const warmth = state.aff * 0.46 + state.trust * 0.34 + state.will * 0.1 + state.vows.length * 2;
    if (warmth >= 72) return { className: "portrait s3", index: 3, label: "会えた喜びを隠さない、やわらかな笑顔" };
    if (warmth >= 48) return { className: "portrait s2", index: 2, label: "あなたとの時間を楽しみにしている笑顔" };
    if (warmth >= 24) return { className: "portrait s1", index: 1, label: "あなたにだけ小さく微笑みはじめた" };
    return { className: "portrait", index: 0, label: "まだ少し距離を測っている" };
  };

  const render = () => {
    const day = Math.min(state.day, MAX_DAY);
    const chapter = chapterNumber(day);
    el("dayChip").textContent = `DAY ${day} / ${PHASES_EN[state.phase]}`;
    el("phaseTitle").textContent = `第${day}日・${PHASES[state.phase]}`;
    el("phaseLabel").textContent = `${PHASES[state.phase]}の行動を選んでください`;
    el("turnsLeft").textContent = Math.max(0, MAX_TURNS - state.steps);
    el("chapterTitle").textContent = chapters[chapter - 1].title;
    el("chapterMeta").textContent = `第${chapter}章 / 全60日・想定5〜6時間`;
    el("campaignBar").style.width = `${Math.min(100, (state.steps / MAX_TURNS) * 100)}%`;
    el("hint").textContent = chapters[chapter - 1].hint;

    ["aff", "trust", "lore", "will", "renown"].forEach((key) => {
      el(`${key}Val`).textContent = state[key];
      el(`${key}Bar`).style.width = `${state[key]}%`;
    });
    el("energyVal").textContent = state.energy;
    el("energyBar").style.width = `${state.energy * 10}%`;

    el("inventory").innerHTML = `<span>大切なもの</span>${state.items.length
      ? state.items.slice(-8).map((item) => `<span class="item">${item}</span>`).join("")
      : '<span class="item empty">まだありません</span>'}`;

    const expression = currentExpression();
    el("portrait").className = expression.className;
    el("portrait").setAttribute("aria-label", `レンの立ち絵。${expression.label}`);
    [...el("faces").children].forEach((node, index) => node.classList.toggle("on", index === expression.index));

    const grid = el("actions");
    grid.innerHTML = "";
    actionsLong.forEach((action) => {
      const enoughEnergy = state.energy >= action.cost;
      const unlocked = !action.unlock || action.unlock();
      const available = !state.ended && !currentEvent && enoughEnergy && unlocked;
      const button = document.createElement("button");
      button.type = "button";
      button.className = "action";
      button.disabled = !available;
      const reason = !enoughEnergy ? "【体力不足】" : !unlocked ? `【${action.lock}】` : "";
      button.innerHTML = `<span class="icon">${action.icon}</span><strong>${action.name}</strong><small>${action.note}${reason}</small>`;
      button.onclick = () => doAction(action);
      grid.appendChild(button);
    });

    el("log").innerHTML = state.log.length
      ? state.log.map((entry) => `<li>${entry}</li>`).join("")
      : "<li>六十日にわたる物語は、まだ始まったばかり。</li>";
    el("saveButton").textContent = storageRead(AUTO_KEY) ? "セーブ◆" : "セーブ";
  };

  const doAction = (action) => {
    if (state.ended || currentEvent || state.energy < action.cost || (action.unlock && !action.unlock())) return;
    action.run();
    state.steps += 1;
    state.actionCounts[action.id] = (state.actionCounts[action.id] || 0) + 1;
    const lines = actionLines[action.id];
    say(lines[(state.actionCounts[action.id] - 1) % lines.length]);
    record(`${action.name}を行った。`);
    const side = sideEventFor(action.id);
    advanceTime();
    queueEvent(side);
    sparkle();
    render();
    autoSave();
    setTimeout(processQueue, 220);
  };

  const advanceTime = () => {
    if (state.phase < 2) {
      state.phase += 1;
      return;
    }
    const completedDay = state.day;
    queueEvent(eventForDay(completedDay));
    if (completedDay >= MAX_DAY) {
      pendingEnding = true;
      return;
    }
    state.day += 1;
    state.phase = 0;
    state.energy = Math.min(10, state.energy + 3);
    state.used = [];
    if ((completedDay + 1) % 10 === 1) {
      record(`${chapters[chapterNumber(state.day) - 1].title}が始まった。`);
    }
  };

  const processQueue = () => {
    if (currentEvent || !el("modal").hidden) return;
    const next = eventQueue.shift();
    if (next) {
      showEvent(next);
      return;
    }
    if (pendingEnding) finish();
  };

  const applyChoice = (choice, event) => {
    gain(choice.effects || {});
    addRoute(choice.route, event.checkpoint ? 3 : 1);
    if (choice.vow && !state.vows.includes(choice.vow)) state.vows.push(choice.vow);
    if (event.checkpoint && event.day === 30 && choice.vow) state.route = choice.route;
    if (event.reward) addItem(event.reward);
    if (event.title === "封じられた星図" && choice.route === "truth") addFlag("秘密を分かち合った");
    if (event.title === "夜明け前の告白" && choice.route === "garden") addFlag("夜明け前の告白");
    record(`${event.title}——${choice.label}`);
    state.reaction = null;
    currentEvent = null;
    el("modal").hidden = true;
    sparkle();
    render();
    autoSave();
    setTimeout(processQueue, 120);
  };

  const showEvent = (event) => {
    currentEvent = event;
    state.reaction = event.reaction;
    render();
    const box = el("event");
    box.className = "event";
    const paragraphs = event.text.split("\n").map((text) => `<p>${text}</p>`).join("");
    box.innerHTML = `<p class="micro">${event.tag}</p><h3>${event.title}</h3>${paragraphs}<div class="event-choices"></div>`;
    const list = box.querySelector(".event-choices");
    event.choices.forEach((choice) => {
      const button = document.createElement("button");
      const available = !choice.ok || choice.ok();
      button.type = "button";
      button.className = "event-choice";
      button.disabled = !available;
      button.innerHTML = `<strong>${choice.label}</strong><span>${choice.note}${available ? "" : " ／ 条件不足"}</span>`;
      button.onclick = () => applyChoice(choice, event);
      list.appendChild(button);
    });
    el("modal").hidden = false;
  };

  const endingData = () => {
    const trueItems = ["月白花の核", "天球儀の欠片", "王家の星印"].every(hasItem);
    const trueEnding = state.aff >= 88 && state.trust >= 85 && state.lore >= 75
      && state.will >= 65 && state.renown >= 55 && state.vows.length >= 6 && trueItems;
    if (trueEnding) return ["S", "星詠みの庭", "犠牲のない術式が完成し、星蝕は黎明へほどけた。レンはすべての記憶を抱いたまま、恋人として、研究者として、あなたと六十日より長い未来を選ぶ。"];
    if (state.route === "garden" && state.aff >= 78 && state.trust >= 70) return ["A", "花守たちの春", "王都の役目を分かち合いながら、二人は温室を帰る場所にした。季節ごとに増える花と同じ数だけ、穏やかな約束が増えていく。"];
    if (state.route === "truth" && state.lore >= 82 && state.trust >= 68) return ["A", "ふたりの星図", "二人は新しい天文学の扉を開き、犠牲を必要としない研究を世界へ広げた。論文の署名は、いつも同じ行に並ぶ。"];
    if (state.route === "crown" && state.renown >= 78 && state.will >= 68) return ["A", "王都を照らす星", "あなたとレンは王都の花守として人々に迎えられた。公の場では凛々しく、温室へ帰れば二人だけの笑顔を交わす。"];
    if (state.aff >= 58 && state.trust >= 52) return ["B", "次の六十日へ", "星蝕は越えたが、言葉にできなかった想いが残った。けれど二人は別れず、次の季節を一緒に選び直す。"];
    if (state.lore >= 60 || state.renown >= 60) return ["C", "星花の記録", "王都と研究は守られた。レンとの距離は戻らなかったが、共に過ごした六十日は消えない記録として残る。"];
    return ["D", "閉じた蕾", "星灯花は眠り、二人は違う道を歩いた。失敗ではなく、まだ答えに届かなかった物語として、庭は次の花守を待つ。"];
  };

  const finish = () => {
    pendingEnding = false;
    state.ended = true;
    state.reaction = 3;
    render();
    autoSave();
    const ending = endingData();
    const trueItems = ["月白花の核", "天球儀の欠片", "王家の星印"].every(hasItem);
    const checks = [
      ["好感度 88", state.aff >= 88],
      ["信頼 85", state.trust >= 85],
      ["知識 75", state.lore >= 75],
      ["決意 65", state.will >= 65],
      ["王都評価 55", state.renown >= 55],
      ["六つの章の誓い", state.vows.length >= 6],
      ["三つの重要品", trueItems],
    ];
    const box = el("event");
    box.className = "event ending";
    box.innerHTML = `<div class="rank">${ending[0]}</div><p class="micro">ENDING / ${state.route || dominantRoute()}</p><h3>${ending[1]}</h3><p>${ending[2]}</p>
      <div class="requirements">${checks.map(([label, ok]) => `<div class="req ${ok ? "ok" : "no"}">${ok ? "✓" : "×"} ${label}</div>`).join("")}</div>
      <button type="button" id="endingSave">この結末をセーブ</button> <button type="button" id="retryLong">最初から遊ぶ</button>`;
    el("modal").hidden = false;
    el("endingSave").onclick = () => {
      saveSlot(3);
      showToast("セーブ枠3に結末を保存しました");
    };
    el("retryLong").onclick = resetGame;
  };

  function storageRead(key) {
    try {
      const value = localStorage.getItem(key);
      return value ? JSON.parse(value) : null;
    } catch {
      return null;
    }
  }

  function storageWrite(key, payload) {
    try {
      localStorage.setItem(key, JSON.stringify(payload));
      return true;
    } catch {
      showToast("このブラウザではセーブを利用できません");
      return false;
    }
  }

  const savePayload = () => ({
    savedAt: new Date().toISOString(),
    summary: `第${Math.min(state.day, MAX_DAY)}日・${PHASES[state.phase]} / ${chapters[chapterNumber() - 1].title}`,
    state,
  });

  const autoSave = () => storageWrite(AUTO_KEY, savePayload());

  const saveSlot = (slot) => {
    if (storageWrite(SLOT_KEY(slot), savePayload())) {
      showToast(`セーブ枠${slot}に保存しました`);
      render();
    }
  };

  const normalizeLoadedState = (loaded) => {
    const base = freshState();
    const next = { ...base, ...loaded };
    next.routes = { ...base.routes, ...(loaded.routes || {}) };
    next.actionCounts = { ...base.actionCounts, ...(loaded.actionCounts || {}) };
    ["items", "flags", "vows", "used", "log", "seen"].forEach((key) => {
      if (!Array.isArray(next[key])) next[key] = [];
    });
    return next;
  };

  const loadPayload = (payload) => {
    if (!payload || !payload.state) return;
    state = normalizeLoadedState(payload.state);
    state.reaction = null;
    eventQueue = [];
    currentEvent = null;
    pendingEnding = false;
    el("modal").hidden = true;
    say(`おかえり。第${Math.min(state.day, MAX_DAY)}日の続きから始めよう。`);
    render();
    sparkle();
    showToast("セーブデータを読み込みました");
  };

  const saveDateText = (payload) => {
    if (!payload) return "セーブデータはありません";
    const date = new Date(payload.savedAt);
    return `${payload.summary} ／ ${date.toLocaleString("ja-JP")}`;
  };

  const openSaveMenu = () => {
    if (currentEvent) {
      showToast("イベントの選択後にセーブできます");
      return;
    }
    const auto = storageRead(AUTO_KEY);
    const slots = [1, 2, 3].map((slot) => ({ slot, payload: storageRead(SLOT_KEY(slot)) }));
    const box = el("event");
    box.className = "event";
    box.innerHTML = `<p class="micro">SAVE / LOAD</p><h3>星の記憶</h3><p>進行はこのブラウザ・この端末に保存されます。手動セーブは3枠です。</p>
      <div class="save-grid">
        <div class="save-slot"><strong>自動セーブ</strong><small>${saveDateText(auto)}</small><div class="save-actions"><button type="button" data-auto-load ${auto ? "" : "disabled"}>続きから</button></div></div>
        ${slots.map(({ slot, payload }) => `<div class="save-slot"><strong>セーブ枠 ${slot}</strong><small>${saveDateText(payload)}</small>
          <div class="save-actions"><button type="button" data-save="${slot}">保存</button><button type="button" data-load="${slot}" ${payload ? "" : "disabled"}>読込</button><button type="button" data-delete="${slot}" ${payload ? "" : "disabled"}>削除</button></div></div>`).join("")}
      </div><p class="save-note">自動セーブは各行動・イベント選択後に更新されます。別のブラウザや端末には引き継がれません。</p>
      <button type="button" id="closeSave">物語へ戻る</button>`;
    box.querySelector("[data-auto-load]")?.addEventListener("click", () => loadPayload(auto));
    box.querySelectorAll("[data-save]").forEach((button) => button.addEventListener("click", () => {
      saveSlot(Number(button.dataset.save));
      openSaveMenu();
    }));
    box.querySelectorAll("[data-load]").forEach((button) => button.addEventListener("click", () => {
      loadPayload(storageRead(SLOT_KEY(Number(button.dataset.load))));
    }));
    box.querySelectorAll("[data-delete]").forEach((button) => button.addEventListener("click", () => {
      const slot = Number(button.dataset.delete);
      if (confirm(`セーブ枠${slot}を削除しますか？`)) {
        localStorage.removeItem(SLOT_KEY(slot));
        openSaveMenu();
      }
    }));
    box.querySelector("#closeSave").onclick = () => {
      el("modal").hidden = true;
      render();
    };
    el("modal").hidden = false;
  };

  const resetGame = () => {
    if (state.steps > 0 && !confirm("最初からやり直しますか？ 自動セーブも新しい物語で上書きされます。")) return;
    state = freshState();
    eventQueue = [];
    currentEvent = null;
    pendingEnding = false;
    el("modal").hidden = true;
    say("星蝕まで六十日。長い研究になる。……それでも、僕と最後まで歩いてくれる？");
    render();
    sparkle();
    autoSave();
  };

  const boot = () => {
    state = freshState();
    eventQueue = [];
    currentEvent = null;
    pendingEnding = false;
    el("modal").hidden = true;
    el("saveButton").onclick = openSaveMenu;
    el("reset").onclick = resetGame;
    say("星蝕まで六十日。長い研究になる。……それでも、僕と最後まで歩いてくれる？");
    render();
    sparkle();
    if (storageRead(AUTO_KEY)?.state?.steps > 0) {
      showToast("自動セーブがあります。「セーブ◆」から続けられます");
    }
  };

  boot();
})();

</script>
</body>
</html>
