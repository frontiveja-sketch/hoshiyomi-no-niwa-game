<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>星詠みの庭｜十夜の星花編</title>
  <style>
    :root{
      --night:#11132b;--night2:#242245;--paper:#fffaf2;--ink:#292139;
      --plum:#4c365f;--rose:#ae5573;--blush:#f4bdcb;--gold:#c9a768;
      --muted:#897785;--good:#5f8c80;--bad:#a75668
    }
    *{box-sizing:border-box}html,body{min-width:320px;min-height:100%;margin:0}
    body{color:var(--ink);font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;
      background:radial-gradient(circle at 80% 18%,rgba(190,158,224,.3),transparent 26rem),
      radial-gradient(circle at 12% 80%,rgba(245,172,192,.16),transparent 30rem),
      linear-gradient(135deg,var(--night),var(--night2) 54%,#17152d)}
    button{font:inherit}.shell{position:relative;min-height:100svh;overflow:hidden}
    .stars{position:fixed;inset:0;pointer-events:none;opacity:.38;background-image:
      radial-gradient(circle,#fff 0 1px,transparent 1.6px),
      radial-gradient(circle,#d9c4ff 0 1px,transparent 1.7px);
      background-position:12px 18px,42px 51px;background-size:87px 87px,131px 131px}
    header{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;
      min-height:82px;padding:14px clamp(18px,3vw,52px);border-bottom:1px solid rgba(255,255,255,.13);color:white}
    .brand{display:flex;align-items:center;gap:13px}.mark{display:grid;width:40px;aspect-ratio:1;place-items:center;
      border:1px solid rgba(236,214,158,.7);border-radius:50%;color:#ead49c}
    .micro{margin:0;color:var(--gold);font:700 .62rem Arial,sans-serif;letter-spacing:.21em}
    h1{margin:2px 0 0;font-size:clamp(1.16rem,2vw,1.65rem);font-weight:500;letter-spacing:.12em}
    .head-actions{display:flex;align-items:center;gap:10px}.head-actions button{padding:8px 14px;border:1px solid rgba(255,255,255,.28);
      border-radius:99px;color:white;background:rgba(255,255,255,.08);cursor:pointer}
    .day-chip{padding:8px 14px;border:1px solid rgba(232,207,151,.4);color:#f1ddb0;font:700 .7rem Arial,sans-serif;letter-spacing:.12em}
    .game{position:relative;z-index:2;display:grid;grid-template-columns:minmax(360px,.76fr) minmax(440px,1.24fr);
      width:min(1500px,calc(100% - 32px));min-height:calc(100svh - 82px);margin:auto;border-inline:1px solid rgba(255,255,255,.1)}
    .portrait-side{position:relative;min-height:760px;overflow:hidden;background:
      radial-gradient(circle at 50% 24%,rgba(223,198,247,.24),transparent 28%),
      linear-gradient(to top,rgba(10,10,28,.94),transparent 50%)}
    .portrait-side:after{content:"";position:absolute;z-index:3;inset:auto 0 0;height:30%;background:linear-gradient(to top,#12122d,transparent);pointer-events:none}
    .arch{position:absolute;inset:6% 8% 8%;border:1px solid rgba(226,200,144,.24);border-radius:48% 48% 0 0}
    .arch:before,.arch:after{content:"";position:absolute;inset:14px;border:1px solid rgba(255,255,255,.07);border-radius:inherit}
    .portrait-window{position:absolute;z-index:2;right:auto;bottom:0;left:50%;
      width:auto;height:min(calc(100% - 14px),820px);max-width:55%;aspect-ratio:1/2;
      transform:translateX(-50%);overflow:hidden}

    .portrait-name{position:absolute;z-index:5;right:auto;bottom:68px;left:50%;
      width:min(calc(100% - 40px),360px);padding:16px 18px;transform:translateX(-50%);
      border:1px solid rgba(255,255,255,.2);color:white;background:rgba(18,17,43,.67);backdrop-filter:blur(10px)}

      border:1px solid rgba(255,255,255,.5);border-radius:50%;transition:.35s}.faces i.on{border-color:var(--blush);background:var(--blush);box-shadow:0 0 12px var(--blush)}
    .spark{position:absolute;z-index:4;inset:12% 10% 28%;pointer-events:none}.spark span{position:absolute;color:#ffe6a9;opacity:0}
    .spark.go span{animation:spark .9s ease-out}.spark span:nth-child(1){top:8%;left:12%}.spark span:nth-child(2){top:22%;right:8%;animation-delay:.1s}
    .spark span:nth-child(3){top:48%;left:7%;animation-delay:.18s}.spark span:nth-child(4){top:10%;right:26%;animation-delay:.25s}
    .control{position:relative;z-index:4;padding:clamp(24px,3.5vw,50px);background:linear-gradient(145deg,rgba(255,250,242,.985),rgba(246,237,237,.97));
      box-shadow:-30px 0 70px rgba(6,7,24,.25)}
    .control:before{content:"";position:absolute;inset:0 auto 0 0;width:8px;opacity:.45;background:repeating-linear-gradient(90deg,var(--gold) 0 1px,transparent 1px 4px)}
    .topline{display:flex;align-items:center;gap:12px;color:#7c7080;font-size:.7rem;letter-spacing:.11em}.topline i{width:36px;height:1px;background:var(--gold)}
    .title-row{display:flex;align-items:end;justify-content:space-between;gap:18px;margin:24px 0 20px}
    h2{margin:4px 0 0;color:#2b233c;font-size:clamp(1.75rem,3.3vw,3.1rem);font-weight:500;letter-spacing:.06em}
    .turn{min-width:145px;text-align:right}.turn strong{display:block;color:var(--rose);font:400 2rem Georgia,serif}.turn span{color:var(--muted);font-size:.7rem}
    .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:17px}
    .stat{padding:10px;border:1px solid rgba(77,54,95,.14);background:rgba(255,255,255,.65)}
    .stat label{display:flex;justify-content:space-between;color:#756473;font-size:.67rem}.stat b{color:var(--plum);font-family:Georgia,serif;font-weight:400}
    .bar{height:4px;margin-top:7px;overflow:hidden;border-radius:99px;background:#e5dce1}.bar i{display:block;height:100%;background:linear-gradient(90deg,#c98ca1,#9d4967);transition:width .45s}
    .stat.energy .bar i{background:linear-gradient(90deg,#8bb1a7,#527d74)}
    .inventory{display:flex;align-items:center;gap:7px;min-height:31px;margin-bottom:16px;color:#766875;font-size:.68rem}
    .inventory>span:first-child{margin-right:3px;color:#9a8053;letter-spacing:.08em}.item{padding:4px 8px;border:1px solid rgba(199,166,104,.35);background:#fffdf8}
    .item.empty{color:#aaa;border-style:dashed;background:transparent}
    .dialogue{position:relative;min-height:104px;padding:27px 24px 18px;border-block:1px solid rgba(199,166,104,.58);
      background:linear-gradient(90deg,rgba(255,255,255,.78),transparent);animation:reveal .38s ease}
    .nameplate{position:absolute;top:-11px;left:17px;padding:3px 18px;color:white;background:var(--plum);font-size:.74rem;letter-spacing:.12em}
    .dialogue p{margin:0;color:#3d3448;font-size:clamp(.86rem,1.25vw,1rem);line-height:1.9}
    .hint{display:flex;align-items:center;gap:8px;margin:13px 0;padding:8px 11px;border-left:2px solid var(--gold);color:#776776;background:rgba(255,255,255,.43);font-size:.68rem;line-height:1.6}
    .actions-title{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px}.actions-title p{margin:0;color:#8d7780;font:700 .62rem Arial,sans-serif;letter-spacing:.18em}
    .actions-title span{color:#8f808c;font-size:.65rem}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
    .action{position:relative;min-height:65px;padding:10px 12px 10px 47px;border:1px solid rgba(77,56,95,.2);text-align:left;color:#40344e;background:rgba(255,255,255,.74);cursor:pointer;transition:.17s}
    .action:hover:not(:disabled),.action:focus-visible:not(:disabled){border-color:var(--rose);background:white;transform:translateY(-2px);box-shadow:0 8px 22px rgba(77,56,95,.1);outline:none}
    .action:disabled{opacity:.43;cursor:not-allowed}.action .icon{position:absolute;left:12px;top:13px;display:grid;width:25px;aspect-ratio:1;place-items:center;border:1px solid rgba(199,166,104,.5);border-radius:50%;color:#a47b44}
    .action strong{display:block;font-size:.81rem;font-weight:500}.action small{display:block;margin-top:4px;color:#8e7f89;font-family:Arial,sans-serif;font-size:.59rem;line-height:1.35}
    .journal{margin-top:13px;padding-top:10px;border-top:1px solid rgba(77,56,95,.12)}
    .journal summary{color:#7c6c78;font-size:.68rem;cursor:pointer}.journal ol{max-height:92px;margin:8px 0 0;padding-left:21px;overflow:auto;color:#8b7b86;font-size:.66rem;line-height:1.65}
    .modal{position:fixed;z-index:50;inset:0;display:grid;place-items:center;padding:18px;background:rgba(9,9,25,.78);backdrop-filter:blur(8px)}
    .modal[hidden]{display:none}.event{width:min(620px,100%);padding:clamp(24px,4vw,42px);border:1px solid rgba(233,207,150,.55);
      color:var(--ink);background:linear-gradient(145deg,#fffaf2,#f1e5e8);box-shadow:0 30px 100px rgba(0,0,0,.4);animation:reveal .42s ease}
    .event .micro{color:#9e7945}.event h3{margin:8px 0 13px;color:var(--plum);font-size:clamp(1.35rem,4vw,2rem);font-weight:500}
    .event>p{color:#675b68;font-size:.84rem;line-height:1.9}.event-choices{display:grid;gap:8px;margin-top:19px}
    .event-choice{padding:13px 15px;border:1px solid rgba(77,56,95,.2);text-align:left;color:#40344e;background:rgba(255,255,255,.72);cursor:pointer}
    .event-choice:hover:not(:disabled){border-color:var(--rose);background:white}.event-choice:disabled{opacity:.4}
    .event-choice strong{display:block;font-size:.82rem;font-weight:500}.event-choice span{display:block;margin-top:3px;color:#8e7d89;font-size:.65rem}
    .ending{text-align:center}.ending .rank{display:grid;width:70px;aspect-ratio:1;margin:0 auto 15px;place-items:center;border:1px solid var(--gold);border-radius:50%;color:var(--rose);font:400 2rem Georgia,serif}
    .ending h3{font-size:clamp(1.7rem,5vw,2.6rem)}.ending button{margin-top:20px;padding:11px 24px;border:0;border-radius:99px;color:white;background:var(--rose);cursor:pointer}
    .requirements{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:18px}.req{padding:8px;border:1px solid rgba(77,56,95,.15);font-size:.65rem}.req.ok{color:var(--good);border-color:rgba(95,140,128,.4)}.req.no{color:var(--bad)}
    @keyframes reveal{from{opacity:0;transform:translateY(8px)}}@keyframes spark{0%{opacity:0;transform:scale(.5)}38%{opacity:1}100%{opacity:0;transform:scale(1.8) rotate(45deg) translateY(-18px)}}
    @media(max-width:980px){.game{grid-template-columns:1fr;width:100%;border:0}.portrait-side{min-height:clamp(520px,72svh,740px)}.portrait-window{height:min(calc(100% - 14px),700px);max-width:54%}.control{padding:30px clamp(20px,6vw,50px) 45px}.stats{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:580px){header{min-height:72px}.micro.head{display:none}.day-chip{display:none}.head-actions button{font-size:.7rem}.portrait-side{min-height:clamp(460px,68svh,620px)}.portrait-window{height:min(calc(100% - 10px),590px);max-width:68%}.title-row{align-items:start}.turn{min-width:90px}.turn strong{font-size:1.55rem}.stats{grid-template-columns:repeat(2,1fr)}.actions{grid-template-columns:1fr}.requirements{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
<main class="shell">
  <div class="stars" aria-hidden="true"></div>
  <header>
    <div class="brand"><span class="mark">✦</span><div><p class="micro head">OFFLINE STRATEGY ROMANCE</p><h1>星詠みの庭</h1></div></div>
    <div class="head-actions"><span class="day-chip" id="dayChip">DAY 1 / MORNING</span><button type="button" id="reset">最初から</button></div>
  </header>
  <section class="game">
    <aside class="portrait-side">
      <div class="arch"></div>
      <div class="portrait-window"><div class="portrait" id="portrait" role="img" aria-label="レンの立ち絵"></div></div>
      <div class="spark" id="spark" aria-hidden="true"><span>✦</span><span>✧</span><span>✦</span><span>✧</span></div>
      <div class="portrait-name"><strong>レン・アステル</strong><span>CELESTIAL BOTANIST</span></div>
      <div class="faces" id="faces"><i></i><i></i><i></i><i></i></div>
    </aside>
    <section class="control">
      <div class="topline"><span>十夜の星花編</span><i></i><span>王立天象院・星花温室</span></div>
      <div class="title-row">
        <div><p class="micro">TEN DAYS UNTIL THE METEOR FESTIVAL</p><h2 id="phaseTitle">第1日・朝</h2></div>
        <div class="turn"><strong id="turnsLeft">20</strong><span>残り行動</span></div>
      </div>
      <div class="stats">
        <div class="stat"><label>好感度 <b id="affVal">10</b></label><div class="bar"><i id="affBar"></i></div></div>
        <div class="stat"><label>信頼 <b id="trustVal">8</b></label><div class="bar"><i id="trustBar"></i></div></div>
        <div class="stat"><label>星花知識 <b id="loreVal">0</b></label><div class="bar"><i id="loreBar"></i></div></div>
        <div class="stat"><label>決意 <b id="willVal">3</b></label><div class="bar"><i id="willBar"></i></div></div>
        <div class="stat energy"><label>体力 <b id="energyVal">9</b></label><div class="bar"><i id="energyBar"></i></div></div>
      </div>
      <div class="inventory" id="inventory"><span>大切なもの</span></div>
      <div class="dialogue" id="dialogue"><span class="nameplate" id="speaker">レン</span><p id="line"></p></div>
      <div class="hint"><span>✦</span><span id="hint">高い好感度だけでは真実の恋には届かない。信頼と研究、そして自分の決意も育てよう。</span></div>
      <div class="actions-title"><p>SELECT AN ACTION</p><span id="phaseLabel">朝の行動を選んでください</span></div>
      <div class="actions" id="actions"></div>
      <details class="journal"><summary>これまでの記録</summary><ol id="log"></ol></details>
    </section>
  </section>
</main>
<div class="modal" id="modal" hidden><div class="event" id="event"></div></div>
<script>
const clamp=n=>Math.max(0,Math.min(100,n));
const initial=()=>({day:1,phase:0,aff:10,trust:8,lore:0,will:3,energy:9,items:[],flags:[],used:[],log:[],ended:false});
let s=initial();
const $=id=>document.getElementById(id);
const statusLine=()=>{const warmth=s.aff*.55+s.trust*.3+s.will*.15;return warmth>=70?["3","恋心を隠せない、とびきりの笑顔"]:warmth>=46?["2","会える時間を、楽しみにしている"]:warmth>=25?["1","あなたにだけ、微笑みを見せはじめた"]:["0","まだ少し、距離を測っているみたい"]};
const actions=[
  {id:"green",icon:"❀",name:"温室を手伝う",note:"好感度・知識／体力−2",cost:2,run(){gain({aff:5,lore:3,trust:1,energy:-2});if(s.lore>=18&&!has("月白花の種"))addItem("月白花の種");say("君は花の声を聞くのが上手だね。……僕よりも、少しだけ。");record("温室で星花の世話をした。");}},
  {id:"archive",icon:"⌕",name:"書庫で研究する",note:"知識を大きく上昇／体力−2",cost:2,run(){gain({lore:7,trust:2,energy:-2});if(s.lore>=28&&!has("星砂の栞"))addItem("星砂の栞");say("その頁に気づくとは思わなかった。君になら、研究を任せられそうだ。");record("古い星花の記録を読み解いた。");}},
  {id:"errand",icon:"♧",name:"王都の依頼を手伝う",note:"信頼・決意／体力−3",cost:3,run(){gain({trust:6,will:4,aff:1,energy:-3});say("君となら、面倒な仕事も悪くない。頼りにしているよ。");record("レンと協力して王都の依頼を終えた。");}},
  {id:"tea",icon:"♨",name:"二人でお茶を飲む",note:"信頼18以上・各日1回",cost:2,unlock:()=>s.trust>=18&&!s.used.includes("tea"),run(){gain({aff:6,trust:4,lore:1,energy:-2});say("こうして君と話す時間が、最近はいちばん落ち着くんだ。");s.used.push("tea");record("温室の奥で二人きりのお茶を楽しんだ。");}},
  {id:"walk",icon:"☾",name:"星見の散歩に誘う",note:"4日目・好感度25以上・夜限定",cost:3,unlock:()=>s.day>=4&&s.phase===1&&s.aff>=25&&!s.used.includes("walk"),run(){gain({aff:7,will:5,trust:2,energy:-3});say("君の隣で見る星は、なぜかいつもより近いね。");s.used.push("walk");record("レンと星空の下を歩いた。");}},
  {id:"rest",icon:"✦",name:"自室で休む",note:"体力＋6・関係値は変化なし",cost:0,run(){gain({energy:6});say("無理はしないで。君が倒れたら……僕が困る。");record("次の行動に備えて体を休めた。");}}
];
const events={
  "2-0":{tag:"SPECIAL EVENT 01",title:"芽吹かない星灯花",text:"レンが十年育てても芽吹かなかった種を見せてくれた。扱い方ひとつで、彼との距離も研究も変わりそうだ。",choices:[
    ["まず土と星位を調べる","知識を活かす","+知識10・信頼3",()=>gain({lore:10,trust:3})],
    ["レンの考えを最後まで聞く","彼を信じる","+信頼9・好感度4",()=>gain({trust:9,aff:4})],
    ["直感を信じ、光にかざす","決意を示す","+決意9・好感度3／知識が高いと種を獲得",()=>{gain({will:9,aff:3});if(s.lore>=15)addItem("月白花の種")}] ]},
  "4-1":{tag:"SPECIAL EVENT 02",title:"硝子温室の嵐",text:"突然の星嵐で温室の天窓が割れた。花、研究記録、そしてレン——すべてを守る時間はない。",choices:[
    ["レンと背中を預け合い、天窓を塞ぐ","体力3以上で選択可","+信頼12・決意6／体力−3",()=>{gain({trust:12,will:6,energy:-3});flag("嵐を共に越えた")} ,()=>s.energy>=3],
    ["危険を承知でレンのもとへ走る","気持ちを優先","+好感度11・信頼4／体力−2",()=>{gain({aff:11,trust:4,energy:-2});flag("嵐を共に越えた")}],
    ["失われかけた研究記録を救う","未来を優先","+知識13・信頼5",()=>gain({lore:13,trust:5})] ]},
  "6-0":{tag:"SPECIAL EVENT 03",title:"流星祭への招待",text:"レンは招待状を手に、珍しく言葉を探している。好感度か信頼が足りていれば、彼の本心を引き出せそうだ。",choices:[
    ["「あなたと一緒に行きたい」","好感度30または信頼28で選択可","+好感度9・決意8／約束成立",()=>{gain({aff:9,will:8});flag("流星祭の約束")} ,()=>s.aff>=30||s.trust>=28],
    ["仕事の相談を口実に同行する","慎重な距離感","+信頼7・好感度4",()=>gain({trust:7,aff:4})],
    ["祭より研究を完成させたい","研究優先","+知識10・決意4",()=>gain({lore:10,will:4})] ]},
  "8-1":{tag:"SPECIAL EVENT 04",title:"封じられた研究ノート",text:"書庫の奥で、レンが隠していた失敗の記録を見つけた。開くか、待つか。あなたの積み重ねが選択肢を変える。",choices:[
    ["星砂の栞で暗号を解き、彼に返す","栞＋知識45以上で選択可","+知識8・信頼13／秘密を共有",()=>{gain({lore:8,trust:13});flag("秘密を共有した")} ,()=>has("星砂の栞")&&s.lore>=45],
    ["本人が話すまで待つ","彼の境界を尊重","+信頼10・好感度4／秘密を共有",()=>{gain({trust:10,aff:4});flag("秘密を共有した")}],
    ["問い詰めて真実を聞く","答えを急ぐ","+知識6・決意4／信頼−5",()=>gain({lore:6,will:4,trust:-5})] ]},
  "10-0":{tag:"FINAL EVENT",title:"祭りの朝、最後の贈り物",text:"今夜、十年に一度の流星が降る。レンへ渡すものが、二人の結末をそっと後押しする。",choices:[
    ["育てた月白花の種を贈る","種を持っていると選択可","+好感度11・信頼5",()=>gain({aff:11,trust:5}),()=>has("月白花の種")],
    ["研究を完成させた星図を贈る","知識55以上で選択可","+信頼9・知識6",()=>gain({trust:9,lore:6}),()=>s.lore>=55],
    ["何も飾らず、想いを告げる","決意30以上で選択可","+決意10・好感度8",()=>gain({will:10,aff:8}),()=>s.will>=30],
    ["今までの感謝だけを伝える","条件なし","+好感度4・信頼4",()=>gain({aff:4,trust:4})] ]}
};
function has(x){return s.items.includes(x)}function flag(x){if(!s.flags.includes(x))s.flags.push(x)}
function addItem(x){if(!has(x)){s.items.push(x);record("大切なもの「"+x+"」を手に入れた。")}}
function gain(o){for(const[k,v]of Object.entries(o)){s[k]=k==="energy"?Math.max(0,Math.min(10,s[k]+v)):clamp(s[k]+v)}}
function record(text){s.log.unshift("第"+s.day+"日"+(s.phase?"・夜":"・朝")+"： "+text);s.log=s.log.slice(0,12)}
function say(text,speaker="レン"){$("speaker").textContent=speaker;$("line").textContent="「"+text+"」";$("dialogue").style.animation="none";void $("dialogue").offsetWidth;$("dialogue").style.animation=""}
function sparkle(){$("spark").classList.remove("go");void $("spark").offsetWidth;$("spark").classList.add("go")}
function doAction(a){if(s.ended||s.energy<a.cost||(a.unlock&&!a.unlock()))return;a.run();sparkle();advance()}
function advance(){if(s.phase===0){s.phase=1}else{s.phase=0;s.day++;s.energy=Math.min(10,s.energy+2);s.used=[]}render();if(s.day>10){finish();return}const key=s.day+"-"+s.phase;if(events[key])window.setTimeout(()=>showEvent(events[key]),280)}
function showEvent(e){const box=$("event");box.className="event";box.innerHTML='<p class="micro">'+e.tag+'</p><h3>'+e.title+'</h3><p>'+e.text+'</p><div class="event-choices"></div>';const list=box.querySelector(".event-choices");
  e.choices.forEach(c=>{const b=document.createElement("button");const ok=!c[4]||c[4]();b.className="event-choice";b.disabled=!ok;b.innerHTML="<strong>"+c[0]+"</strong><span>"+c[1]+" ／ "+c[2]+"</span>";b.onclick=()=>{c[3]();record(e.title+"——"+c[0]);$("modal").hidden=true;sparkle();render()};list.appendChild(b)});$("modal").hidden=false}
function endingData(){const trueOk=s.aff>=75&&s.trust>=65&&s.lore>=50&&s.will>=30&&s.flags.includes("流星祭の約束")&&s.flags.includes("秘密を共有した");
  if(trueOk)return["S","星々の誓約","咲いた星灯花の下で、レンはあなたの手を取った。恋人として、研究の相棒として。二人は同じ未来を選び、十年後の星へ歩き始める。"];
  if(s.aff>=65&&s.trust>=50&&s.will>=22)return["A","花咲く告白","流星の夜、二人の想いはようやく言葉になった。まだ知らない秘密はある。それでも、次の季節を一緒に迎える約束をした。"];
  if(s.trust>=55&&s.lore>=65)return["B","ふたりの研究室","恋より先に結ばれたのは、揺るぎない信頼だった。共同研究者となった二人の距離は、これからゆっくり変わっていく。"];
  if(s.aff>=40)return["C","すれ違う流星","想いは確かにあった。けれど互いの未来を重ねるには、言葉と時間が少しだけ足りなかった。"];
  return["D","閉じた蕾","星灯花は眠ったまま、祭りの夜が明けた。次に出会うとき、違う選択ができるだろうか。"]}
function finish(){s.ended=true;const e=endingData();const checks=[["好感度 75",s.aff>=75],["信頼 65",s.trust>=65],["知識 50",s.lore>=50],["決意 30",s.will>=30],["流星祭の約束",s.flags.includes("流星祭の約束")],["秘密の共有",s.flags.includes("秘密を共有した")]];
  const box=$("event");box.className="event ending";box.innerHTML='<div class="rank">'+e[0]+'</div><p class="micro">ENDING</p><h3>'+e[1]+'</h3><p>'+e[2]+'</p><div class="requirements">'+checks.map(x=>'<div class="req '+(x[1]?"ok":"no")+'">'+(x[1]?"✓ ":"× ")+x[0]+"</div>").join("")+'</div><button type="button" id="retry">十日前へ戻る</button>';$("modal").hidden=false;$("retry").onclick=reset}
function render(){const phase=s.phase?"夜":"朝";$("dayChip").textContent="DAY "+Math.min(s.day,10)+" / "+(s.phase?"EVENING":"MORNING");$("phaseTitle").textContent="第"+Math.min(s.day,10)+"日・"+phase;$("phaseLabel").textContent=phase+"の行動を選んでください";$("turnsLeft").textContent=Math.max(0,(10-s.day)*2+(2-s.phase));
  [["aff",s.aff],["trust",s.trust],["lore",s.lore],["will",s.will]].forEach(x=>{$(x[0]+"Val").textContent=x[1];$(x[0]+"Bar").style.width=x[1]+"%"});$("energyVal").textContent=s.energy;$("energyBar").style.width=s.energy*10+"%";
  const inv=$("inventory");inv.innerHTML="<span>大切なもの</span>"+(s.items.length?s.items.map(x=>'<span class="item">'+x+"</span>").join(""):'<span class="item empty">まだありません</span>');
  const st=statusLine();$("portrait").className="portrait"+(st[0]!=="0"?" s"+st[0]:"");$("portrait").setAttribute("aria-label","レンの立ち絵。"+st[1]);[...$("faces").children].forEach((x,i)=>x.classList.toggle("on",i<=+st[0]));
  $("hint").textContent=s.day<6?"好感度だけでなく、信頼・研究・決意の配分が後半の選択肢を開きます。":s.day<9?"流星祭の約束と、レンの秘密を尊重できるかが真実の結末を左右します。":"真エンドには好感度75・信頼65・知識50・決意30に加え、二つの重要な約束が必要です。";
  const grid=$("actions");grid.innerHTML="";actions.forEach(a=>{const ok=s.energy>=a.cost&&(!a.unlock||a.unlock());const b=document.createElement("button");b.type="button";b.className="action";b.disabled=!ok;b.innerHTML='<span class="icon">'+a.icon+"</span><strong>"+a.name+"</strong><small>"+a.note+(s.energy<a.cost?"【体力不足】":"")+"</small>";b.onclick=()=>doAction(a);grid.appendChild(b)});
  $("log").innerHTML=s.log.length?s.log.map(x=>"<li>"+x+"</li>").join(""):"<li>物語はまだ始まったばかり。</li>"}
function reset(){s=initial();$("modal").hidden=true;say("流星祭まで、あと十日。君の力を借りたい。……僕と星灯花を咲かせてくれる？");render();sparkle()}
$("reset").onclick=reset;reset();
</script>
</body>
</html>
